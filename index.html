<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1b2a" />
    <script>try { const theme = localStorage.getItem('3t-theme') === 'light' ? 'light' : 'dark'; document.documentElement.dataset.theme = theme; document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0d1b2a' : '#f4f1de'; } catch { /* Dark mode remains the default when storage is unavailable. */ }</script>
    <meta name="description" content="Your everyday pit stop. Explore game top-ups, phone repair enquiries, and mango, blueberry, and strawberry yogurt at 3T Station." />
    <title>3T Station — Play. Repair. Refresh.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
